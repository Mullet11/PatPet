[package]
name = "patpet"
version = "2.0.0"
edition = "2021"
description = "Widget desktop kucing pixel art: jam, cuaca, Spotify, timer, dan catatan."
publish = false

[dependencies]
# Hanya renderer software: tanpa OpenGL, jadi RAM tetap kecil.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Devices_Geolocation",
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
windows-core = "0.61"

[build-dependencies]
embed-resource = "3"
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
