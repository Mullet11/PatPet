[package]
name = "patpet"
version = "2.0.0"
edition = "2021"
description = "Widget desktop kucing pixel art: jam, cuaca, Spotify, timer, dan catatan."
publish = false

[dependencies]
# Hanya renderer software: tanpa OpenGL, jadi RAM tetap kecil.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
