# ==============================================================
#  PENGATURAN PATPET
# ==============================================================
#  Cara mengubah:
#   1. Ganti nilai di sebelah kanan tanda "=".
#   2. Simpan file ini (Ctrl+S).
#   PatPet langsung memakai perubahan, tidak perlu ditutup dulu.
#
#  Petunjuk:
#   - Tulisan setelah tanda "#" hanya penjelasan dan diabaikan.
#   - Untuk pilihan nyala/mati, tulis "ya" atau "tidak".
#   - Kalau ada yang salah ketik, PatPet memakai nilai bawaan
#     untuk baris itu dan menyebut nomor barisnya di island.
#   - Hapus file ini kalau ingin kembali ke semua nilai bawaan.
#   - Klik kanan island (atau kucing) untuk membuka file ini lagi.
# ==============================================================

[tampilan]
# Bentuk PatPet di layar:
#   bar  = island hitam menempel di tengah atas layar
#   ikon = hanya kucing, bisa diseret ke mana saja
mode = bar

# Ukuran kucing pada mode ikon: 1 = kecil, 2 = sedang, 3 = besar
ukuran_kucing = 2

# Island bersembunyi di atas layar dan muncul saat kursor
# menyentuh tepi atas layar atau saat ada notifikasi.
sembunyi_otomatis = tidak

# Lebar dalam persen dari lebar layar.
lebar_island = 15             # island tertutup: kucing, jam, baterai
lebar_island_hover = 24       # island saat kursor ada di atasnya
lebar_panel = 38              # panel Musik, Timer, dan Catatan

# Diisi sendiri oleh PatPet saat kucing diseret (mode ikon).
posisi_ikon =

[perilaku]
selalu_di_atas = ya                 # tetap di atas jendela aplikasi lain
tutup_saat_pindah_aplikasi = ya     # panel menutup saat klik di luar PatPet
sembunyi_saat_layar_penuh = ya      # saat menonton video atau main game layar penuh
kucing_tidur_setelah = 5            # menit tanpa menyentuh mouse/keyboard (1 sampai 60)

[timer]
durasi = 00:25:00             # durasi awal di tab Timer, format jam:menit:detik
bunyikan_alarm = ya           # bunyi saat waktu habis
lama_alarm = 60               # detik alarm berbunyi sebelum berhenti sendiri (5 sampai 600)

[cuaca]
# "otomatis" memakai lokasi dari Windows.
# Atau tulis nama kota, misalnya:  lokasi = Banjarbaru
lokasi = otomatis

# ==============================================================
#  WARNA
# ==============================================================
#  Format warna:  #RRGGBB      contoh: #FF8800 (oranye)
#                 #RRGGBBAA    dua digit terakhir = tembus pandang,
#                              contoh: #00000080 (hitam setengah transparan)
#
#  Cara mendapatkan kode warna: cari "color picker" di Google,
#  pilih warnanya, lalu salin kode yang diawali tanda #.
# ==============================================================

[warna_dasar]
latar = #000000               # latar island dan panel
kartu = #171412               # kotak di dalam panel: cuaca, lirik, kolom teks, tombol kecil
kartu_disorot = #231F1C       # kotak saat kursor ada di atasnya
garis = #2B2623               # garis pemisah, garis waktu yang kosong, sakelar mati

[warna_teks]
teks = #FEF5E6                # tulisan utama: jam, judul lagu, isi catatan
teks_redup = #A6988B          # tulisan pendukung: tanggal, nama artis
teks_samar = #6E645C          # petunjuk di kolom yang masih kosong

[warna_aksen]
aksen = #FDD5B5               # tombol utama, tab aktif, sakelar nyala, zona waktu
teks_di_aksen = #1E1612       # tulisan dan ikon di atas warna aksen
musik = #7882C8               # ikon musik dan garis waktu lagu
peringatan = #E65A6E          # alarm, deadline lewat, baterai lemah, suhu panas

[warna_detail]
# Biarkan kosong supaya mengikuti warna di bagian atas.
baterai =                     # isi ikon baterai; kosong = ikuti "teks"
baterai_mengisi =             # kosong = ikuti "aksen"
baterai_lemah =               # kosong = ikuti "peringatan"
suhu_panas =                  # kosong = ikuti "peringatan"
progres_timer =               # kosong = ikuti "aksen"
progres_lagu =                # kosong = ikuti "musik"
sakelar_nyala =               # kosong = ikuti "aksen"
bingkai_fokus =               # kolom yang sedang diketik; kosong = ikuti "aksen"
deadline_lewat =              # kosong = ikuti "peringatan"
deadline_hari_ini =           # kosong = ikuti "aksen"
notifikasi =                  # tulisan notifikasi di island; kosong = ikuti "aksen"
